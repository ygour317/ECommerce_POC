<div class="page">
  <h1>Register</h1>
  <p>Make a new account. Password must be at least 8 characters.</p>

  <form (ngSubmit)="submit()" #f="ngForm">
    <p>
      <label>Your name (optional)<br /><input type="text" name="fullName" [(ngModel)]="fullName" autocomplete="name" /></label>
    </p>
    <p>
      <label>Email<br /><input type="email" name="email" [(ngModel)]="email" required autocomplete="email" /></label>
    </p>
    <p>
      <label>Password<br /><input type="password" name="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></label>
    </p>

    @if (errorMessage) {
      <p class="err">{{ errorMessage }}</p>
    }

    <p>
      <button type="submit" [disabled]="f.invalid || loading">{{ loading ? 'Please wait…' : 'Register' }}</button>
    </p>
  </form>

  <p><a routerLink="/login">Already registered? Log in</a></p>
</div>
