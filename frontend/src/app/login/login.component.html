<div class="page">
  <h1>Log in</h1>
  <p>Enter your email and password.</p>
  <p class="note">
    For testing: demo&#64;example.com or admin&#64;example.com — password is Password123 (with capital P).
  </p>

  <form (ngSubmit)="submit()" #f="ngForm">
    <p>
      <label>Email<br /><input type="email" name="email" [(ngModel)]="email" required autocomplete="email" /></label>
    </p>
    <p>
      <label>Password<br /><input type="password" name="password" [(ngModel)]="password" required minlength="8" autocomplete="current-password" /></label>
    </p>

    @if (errorMessage) {
      <p class="err">{{ errorMessage }}</p>
    }

    <p>
      <button type="submit" [disabled]="f.invalid || loading">{{ loading ? 'Please wait…' : 'Log in' }}</button>
    </p>
  </form>

  <p><a href="/register" (click)="goRegister($event)">No account? Register here</a></p>
</div>
