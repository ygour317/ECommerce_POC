<div class="auth-shell">
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted">Welcome back. Use your account credentials.</p>
    <p class="demo-hint">
      Dev accounts (password <code>Password123</code>):
      <strong>demo&#64;example.com</strong> (shopper) ·
      <strong>admin&#64;example.com</strong> (manage products)
    </p>

    <form (ngSubmit)="submit()" #f="ngForm">
      <label>
        <span>Email</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </label>
      <label>
        <span>Password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="current-password"
        />
      </label>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="f.invalid || loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="footer">
      No account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
