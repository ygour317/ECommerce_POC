spring.application.name=ecommerce-backend
# Sample products: src/main/resources/data.sql (embedded H2 only).
# Default users: DevUserSeed (admin@example.com & demo@example.com, password Password123).

spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Run data.sql after Hibernate creates tables (embedded H2 only)
spring.sql.init.mode=embedded

server.port=8080

jwt.secret=change-this-dev-secret-key-min-32-chars!!
jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200
