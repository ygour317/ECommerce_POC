# Activate with: --spring.profiles.active=mysql
# Example: mvn spring-boot:run -Dspring-boot.run.profiles=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed data in data.sql is tuned for embedded H2. For MySQL, import data manually or add Flyway.
spring.sql.init.mode=never
